<li class="catalog-products__item">
  <article class="product-card">
    <div class="product-card__code product-code">
      <div class="product-code__label">Код товара:</div>
      <div class="product-code__value">Npg-13</div>
    </div>
    <product-slider>
      <div class="product-card__slider product-slider swiper">
        <div class="product-slider__wrapper swiper-wrapper">
          <div class="product-slider__slide swiper-slide responsive-media">
            <img src="img/images/pages/catalog/catalog/@@image.jpg" alt="" loading="lazy">
          </div>
          <div class="product-slider__slide swiper-slide responsive-media">
            <img src="img/images/pages/catalog/catalog/@@image.jpg" alt="" loading="lazy">
          </div>
          <div class="product-slider__slide swiper-slide responsive-media">
            <img src="img/images/pages/catalog/catalog/@@image.jpg" alt="" loading="lazy">
          </div>
          <div class="product-slider__slide swiper-slide responsive-media">
            <img src="img/images/pages/catalog/catalog/@@image.jpg" alt="" loading="lazy">
          </div>
          <div class="product-slider__slide swiper-slide responsive-media">
            <img src="img/images/pages/catalog/catalog/@@image.jpg" alt="" loading="lazy">
          </div>
        </div>
        <div class="product-slider__pagination slider-pagination"></div>
      </div>
    </product-slider>
    <h2 class="product-card__title">
      <a href="#">@@title</a>
    </h2>
    <div class="product-card__made product-made">
      <a class="product-made__brand" href="#">Premium Grass</a>
      <a class="product-made__country" href="#">Россия</a>
    </div>
    <tabs-element>
      <div class="product-card__tabs product-tabs">
        <div class="product-tabs__buttons">
          <button class="product-tabs__button" data-tab="Цена за рулон" data-active>Цена за рулон</button>
          <button class="product-tabs__button" data-tab="Цена на отрез">Цена на отрез</button>
        </div>
        <div class="product-tabs__regions">
          <div class="product-tabs__region product-price" data-region="Цена за рулон" data-active>
            <div class="product-price__label">От 1 рулона</div>
            <div class="product-price__values">
              <div class="product-price__old">2000 ₽/м²</div>
              <div class="product-price__current">2000 ₽/м²</div>
            </div>
          </div>
          <div class="product-tabs__region product-price" data-region="Цена на отрез">
            <div class="product-price__label">Цена (отрез)</div>
            <div class="product-price__values">
              <div class="product-price__old">1500 ₽/м²</div>
              <div class="product-price__current">1500 ₽/м²</div>
            </div>
          </div>
        </div>
      </div>
    </tabs-element>
    <div class="product-card__width product-width">
      <div class="product-width__item">2 м</div>
      <div class="product-width__item">4 м</div>
    </div>
    <div class="product-card__bottom">
      <div class="product-card__actions product-actions">
        <button class="product-action">
          <span class="product-action__icon" aria-hidden="true">
            <svg width="16" height="16">
              <use xlink:href="#icon-compare"></use>
            </svg>
          </span>
          <span class="product-action__label">Сравнить</span>
        </button>
        <button class="product-action">
          <span class="product-action__icon" aria-hidden="true">
            <svg width="16" height="16">
              <use xlink:href="#icon-heart"></use>
            </svg>
          </span>
          <span class="product-action__label">В избранное</span>
        </button>
      </div>
      <div class="product-card__buy product-buy">
        <button class="product-buy__button">Купить</button>
        <button class="product-buy__one">Купить в один клик</button>
      </div>
      <div class="product-card__for product-for">
        <div class="product-for__text">Для:</div>
        <a class="product-for__link" href="#">Декоративная</a>
      </div>
    </div>
  </article>
</li>
